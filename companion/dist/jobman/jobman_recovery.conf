description "Jobman Recovery"

start on mounted_userstore and display_ready and loaded_touch
stop on stopping filesystems

env PATH=/usr/local/bin:/bin:/usr/bin:/usr/sbin:/sbin:/app/bin:/app/tools:/app/tools/bin

task

script
    ##### Helpers #####
    set +e # Prevent the anti-bootloop software causing bootloops

    LOG_FILE="/var/tmp/JOBMAN_RECOVERY_LOG.log"
    [ -f "$LOG_FILE" ] || touch "$LOG_FILE"

    log() {
        echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" >> "$LOG_FILE"
    }

    if [ ! -x /mnt/us/jobman/jobman ]; then
        log "[Jobman] Binary missing! Exiting recovery job."
        exit 0
    fi

    log "[Jobman] Recovery job running..."
    ##### Helpers #####

    ##### Abnormal reboot count #####
    BOOT_COUNT_FILE="/var/local/JOBMAN_RECOVERY_BOOT_COUNT"
    BOOT_COUNT=$(cat "$BOOT_COUNT_FILE" 2>/dev/null || echo "0")
    BOOT_COUNT=$((BOOT_COUNT + 1))
    echo "$BOOT_COUNT" > "$BOOT_COUNT_FILE"
    log "[Jobman] Boot attempt #$BOOT_COUNT"

    if [ "$BOOT_COUNT" -gt 3 ]; then
        log "[Jobman] Abnormal number of boots detected ($BOOT_COUNT), entering recovery..."
        touch /var/tmp/JOBMAN_MENU_INVOKED
        /mnt/us/jobman/jobman --recovery "Abnormal reboot count" </dev/null >/dev/null 2>&1
    fi
    ##### Abnormal reboot count #####

    ##### Manually invoked recovery entry #####
    if [ ! -f /var/tmp/JOBMAN_MENU_INVOKED ] && [ -f /mnt/us/JOBMAN_RECOVERY ]; then
        log "[Jobman] Detected JOBMAN_RECOVERY, entering recovery..."
        touch /var/tmp/JOBMAN_MENU_INVOKED
        /mnt/us/jobman/jobman --recovery "Manually invoked" </dev/null >/dev/null 2>&1
    fi
    ##### Manually invoked recovery entry #####

    ##### 10s boot interrupt window #####
    if [ ! -f /var/tmp/JOBMAN_MENU_INVOKED ]; then
        log "[Jobman] Monitoring all input events for 10 seconds; interact now for recovery..."
        
        INTERRUPTED=0 
        TOUCH_BUFFER="/var/tmp/JOBMAN_TOUCH"
        rm -rf "$TOUCH_BUFFER"
        mkdir -p "$TOUCH_BUFFER"

        PIDS=""
        eips 1 1 "Jobman Recovery" # Signal to the user they can begin tapping.
        eips 1 2 "Tap NOW to enter recovery mode."

        # Ah yes, a 100% sane way to do things.
        for dev in /dev/input/event*; do
            if [ -e "$dev" ]; then
                dd if="$dev" of="$TOUCH_BUFFER/${dev##*/}" bs=16 count=1 >/dev/null 2>&1 &
                PIDS="$PIDS $!"
            fi
        done

        for i in $(seq 1 10); do
            for buffer in "$TOUCH_BUFFER"/*; do
                if [ -s "$buffer" ]; then
                    INTERRUPTED=1
                    break 2
                fi
            done

            eips 1 1 "Jobman Recovery"
            eips 1 2 "Tap NOW to enter recovery mode."
            sleep 1
        done
        
        for pid in $PIDS; do
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
        done
        rm -rf "$TOUCH_BUFFER"

        if [ "$INTERRUPTED" -eq 1 ]; then
            log "[Jobman] Physical intercept! Launching recovery..."
            touch /var/tmp/JOBMAN_MENU_INVOKED
            /mnt/us/jobman/jobman --recovery "Boot interrupt" </dev/null >/dev/null 2>&1
        fi
    fi

    if [ ! -f /var/tmp/JOBMAN_MENU_INVOKED ]; then
        log "[Jobman] No user interaction detected. Continuing normal Kindle boot."
    fi
    ##### 10s boot interrupt window #####

    ##### Cleanup #####
    pkill -9 jobman 2>/dev/null # Safety net. Will also kill SSH daemons
    
    if [ -f /var/tmp/JOBMAN_MENU_INVOKED ]; then
        rm -f /var/tmp/JOBMAN_MENU_INVOKED
        if [ -x /var/local/kmc/bin/fbink ]; then
            /var/local/kmc/bin/fbink -k
            sleep 1
            eips 1 1 "Jobman - Resuming boot, please wait..."
        fi
    fi

    eips 1 1 "." && eips 1 2 "." # TODO: Make this better, but hide the "tap" message.

    rm -f /mnt/us/JOBMAN_RECOVERY

    # Start them manually, since we prevented system_setup_after_shpm from automatic start. We also start lab126 ourselves, because demd might be dead.
    # The user should not see a difference if the menu isn't started, we are just a middleman. We extend the boot process ~15s.
    initctl start system_setup_after_shpm >/dev/null 2>&1 || true
    sleep 2
    initctl start lab126 >/dev/null 2>&1 || true

    exit 0
    ##### Cleanup #####
end script